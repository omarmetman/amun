<svg xmlns="http://www.w3.org/2000/svg" width="340" height="64" viewBox="0 0 340 64" role="img">
  <defs>
    <linearGradient id="btn-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="30%" stop-color="#F7D070"/>
      <stop offset="80%" stop-color="#E3A92F"/>
      <stop offset="100%" stop-color="#C99020"/>
    </linearGradient>
    <filter id="btn-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, sans-serif; font-weight: 700; }
  </style>
  <g>
    <!-- Drop Shadow -->
    <rect x="0" y="6" width="340" height="58" rx="8" fill="#5a3802"/>
    <!-- Button Face -->
    <rect x="0" y="0" width="340" height="58" rx="8" fill="url(#btn-gold)" stroke="#FFF5D1" stroke-width="1.2"/>
    <!-- Icon: Rocket Thrust -->
    <g transform="translate(32, 29)">
      <polygon points="0,-14 6,-4 6,10 0,6 -6,10 -6,-4" fill="#0D1F4C"/>
      <polygon points="0,6 3,12 0,16 -3,12" fill="#D8452F"/>
    </g>
    <!-- Label -->
    <text x="180" y="36" font-size="16" fill="#060e24" text-anchor="middle" letter-spacing="1.5">LAUNCH SIMULATOR  ➜</text>
  </g>
</svg>
