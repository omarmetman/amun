<svg xmlns="http://www.w3.org/2000/svg" width="960" height="92" viewBox="0 0 960 92" role="img" aria-label="MISSION OVERVIEW">
  <defs>
    <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c1e"/>
      <stop offset="60%" stop-color="#0d1f4c"/>
      <stop offset="100%" stop-color="#141a38"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E3A92F"/>
      <stop offset="50%" stop-color="#3FA878"/>
      <stop offset="100%" stop-color="#1A3A85" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3A92F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1A3A85" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3FA878" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="clipBox"><rect width="960" height="92" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, system-ui, sans-serif; }
    .mono { font-family: 'SF Mono', Consolas, 'Fira Code', ui-monospace, monospace; }
    @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes sweepAnim { 0% { transform: translateX(-30%); } 100% { transform: translateX(130%); } }
    .fl { animation: floatAnim 4.8s ease-in-out infinite; }
    .sweep { animation: sweepAnim 4s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#clipBox)">
    <!-- Base Background -->
    <rect width="960" height="92" fill="url(#bgGrad)" />

    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#EDE7D8" stroke-width="0.75">
      <line x1="0" y1="23" x2="960" y2="23"/>
      <line x1="0" y1="46" x2="960" y2="46"/>
      <line x1="0" y1="69" x2="960" y2="69"/>
      <line x1="160" y1="0" x2="160" y2="92"/>
      <line x1="320" y1="0" x2="320" y2="92"/>
      <line x1="480" y1="0" x2="480" y2="92"/>
      <line x1="640" y1="0" x2="640" y2="92"/>
      <line x1="800" y1="0" x2="800" y2="92"/>
    </g>

    <!-- Ambient glow behind icon -->
    <circle cx="52" cy="42" r="45" fill="#E3A92F" opacity="0.16" filter="url(#b12)"/>

    <!-- Left 3D Icon -->
    
        <g class="fl">
          <polygon points="28,28 52,42 52,70 28,56" fill="#1A3A85" />
          <polygon points="52,42 76,28 76,56 52,70" fill="#0D1F4C" />
          <polygon points="52,14 76,28 52,42 28,28" fill="#E3A92F" />
          <polyline points="28,28 52,14 76,28" fill="none" stroke="#FFF" stroke-opacity=".7" stroke-width="1.5" />
        </g>
        

    <!-- 3D Extruded Header Text (Layered isometric shadows) -->
    <text x="106" y="58" font-size="28" font-weight="900" letter-spacing="2" fill="#040711">MISSION OVERVIEW</text>
    <text x="105" y="57" font-size="28" font-weight="900" letter-spacing="2" fill="#09132d">MISSION OVERVIEW</text>
    <text x="104" y="56" font-size="28" font-weight="900" letter-spacing="2" fill="#13244e">MISSION OVERVIEW</text>
    <text x="103" y="55" font-size="28" font-weight="900" letter-spacing="2" fill="#1d3570">MISSION OVERVIEW</text>
    <text x="102" y="54" font-size="28" font-weight="900" letter-spacing="2" fill="#2d4f9f">MISSION OVERVIEW</text>
    <text x="101" y="53" font-size="28" font-weight="900" letter-spacing="2" fill="#EDE7D8">MISSION OVERVIEW</text>

    <!-- Subtitle comment tag -->
    <text class="mono" x="930" y="52" font-size="13" font-weight="600" text-anchor="end" fill="#E3A92F" opacity="0.9">// NASA.SPACE.APPS.2026</text>

    <!-- Bottom glowing rule and laser sweep -->
    <rect x="24" y="81" width="912" height="2" rx="1" fill="url(#neonLine)"/>
    <rect class="sweep" x="0" y="80" width="180" height="3" fill="url(#sweepGrad)"/>
  </g>

  <!-- High-tech border -->
  <rect x="1" y="1" width="958" height="90" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.8"/>
</svg>