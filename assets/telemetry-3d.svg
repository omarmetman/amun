<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t-telemetry d-telemetry">
  <title id="t-telemetry">AMUN Aerospace Telemetry &amp; Margin Rulers</title>
  <desc id="d-telemetry">Isometric flight operations console displaying orbital Hohmann trajectory, margin bars, and closed-form calculations</desc>

  <defs>
    <filter id="glow-hud" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="deck-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040817"/>
      <stop offset="100%" stop-color="#0c1636"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142654"/>
      <stop offset="100%" stop-color="#09132e"/>
    </linearGradient>
    <clipPath id="deck-clip"><rect width="1200" height="380" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
    @keyframes pulse-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes sat-orbit {
      0% { transform: translate(180px, 120px); }
      50% { transform: translate(320px, 80px); }
      100% { transform: translate(460px, 120px); }
    }
    .pulse-hud { animation: pulse-dot 2s ease-in-out infinite; }
  </style>

  <g clip-path="url(#deck-clip)">
    <rect width="1200" height="380" fill="url(#deck-bg)"/>

    <!-- Subtle Isometric Background Grid -->
    <g stroke="#1A3A85" stroke-opacity="0.35" stroke-width="1">
      <path d="M0 60 L1200 60 M0 120 L1200 120 M0 180 L1200 180 M0 240 L1200 240 M0 300 L1200 300 M0 360 L1200 360"/>
      <path d="M100 0 L100 380 M250 0 L250 380 M400 0 L400 380 M550 0 L550 380 M700 0 L700 380 M850 0 L850 380 M1000 0 L1000 380 M1150 0 L1150 380"/>
    </g>

    <!-- Header Section Badge -->
    <g transform="translate(40, 28)">
      <rect width="320" height="32" rx="4" fill="#0D1F4C" stroke="#E3A92F" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" fill="#E3A92F"/>
      <text class="mono" x="32" y="21" font-size="12" font-weight="700" fill="#EDE7D8" letter-spacing="1">LIVE FLIGHT TELEMETRY DECK</text>
    </g>

    <text class="mono" x="1160" y="48" font-size="11" fill="#7dd3fc" text-anchor="end" opacity="0.8">
      SAMPLING FREQ: 100 Hz ◆ DETERMINISTIC RUNTIME
    </text>

    <!-- LEFT PANEL: 3D HOHMANN ORBITAL TRANSFER RADAR (Width: 500) -->
    <g transform="translate(40, 75)">
      <rect width="520" height="265" rx="10" fill="url(#card-grad)" stroke="#1A3A85" stroke-width="1.5"/>
      <rect x="0" y="0" width="520" height="30" rx="10" fill="#0b173d" stroke="#1A3A85" stroke-width="1"/>
      <text class="mono" x="18" y="20" font-size="11" fill="#E3A92F" font-weight="700">ORBITAL SYNODIC TRANSFER (3D VIEW)</text>
      <text class="mono" x="500" y="20" font-size="10" fill="#3FA878" text-anchor="end">C3 = 14.8 km²/s²</text>

      <!-- Isometric Orbit Visualization -->
      <g transform="translate(40, 30)">
        <!-- Sun (Center) -->
        <circle cx="220" cy="120" r="14" fill="#E3A92F" filter="url(#glow-hud)"/>
        <circle cx="220" cy="120" r="10" fill="#FFF5D1"/>
        <text class="mono" x="220" y="146" font-size="9" fill="#E3A92F" text-anchor="middle">SOLAR CENTER</text>

        <!-- Inner Orbit (Earth 1.0 AU) -->
        <ellipse cx="220" cy="120" rx="110" ry="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
        <circle cx="110" cy="120" r="7" fill="#0284c7" stroke="#EDE7D8" stroke-width="1.5"/>
        <text class="mono" x="90" y="140" font-size="9" fill="#7dd3fc">EARTH</text>

        <!-- Outer Orbit (Mars 1.52 AU) -->
        <ellipse cx="220" cy="120" rx="180" ry="68" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
        <circle cx="400" cy="120" r="6" fill="#e0533c" stroke="#EDE7D8" stroke-width="1.5"/>
        <text class="mono" x="420" y="140" font-size="9" fill="#fca5a5">MARS</text>

        <!-- Hohmann Elliptic Transfer Arc (Green) -->
        <path d="M 110 120 C 110 50 350 40 400 120" fill="none" stroke="#3FA878" stroke-width="2.8"/>
        <!-- Traveling Probe -->
        <circle cx="230" cy="64" r="5" fill="#E3A92F" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-hud)"/>
        <line x1="230" y1="64" x2="260" y2="40" stroke="#E3A92F" stroke-width="1"/>
        <rect x="260" y="28" width="120" height="20" rx="3" fill="#060c24" stroke="#E3A92F" stroke-width="1"/>
        <text class="mono" x="320" y="42" font-size="9" fill="#EDE7D8" text-anchor="middle">Δv = 3,420 m/s</text>
      </g>
    </g>

    <!-- RIGHT PANEL: 4 AEROSPACE MARGIN RULERS (Width: 580) -->
    <g transform="translate(580, 75)">
      <rect width="580" height="265" rx="10" fill="url(#card-grad)" stroke="#1A3A85" stroke-width="1.5"/>
      <rect x="0" y="0" width="580" height="30" rx="10" fill="#0b173d" stroke="#1A3A85" stroke-width="1"/>
      <text class="mono" x="18" y="20" font-size="11" fill="#E3A92F" font-weight="700">SUBSYSTEM MARGIN METRICS (10% - 30% OPTIMAL)</text>
      <text class="mono" x="560" y="20" font-size="10" fill="#EDE7D8" text-anchor="end">4 SYSTEM VERIFIED</text>

      <g transform="translate(24, 46)">
        <!-- Ruler 1: Mass Budget -->
        <text class="mono" x="0" y="10" font-size="11" fill="#EDE7D8">1. LAUNCH MASS MARGIN [FALCON HEAVY]</text>
        <text class="mono" x="532" y="10" font-size="11" fill="#3FA878" font-weight="700" text-anchor="end">+24.2% [NOMINAL]</text>
        <g transform="translate(0, 16)">
          <rect width="532" height="14" rx="3" fill="#060d24" stroke="#1A3A85"/>
          <rect x="53" width="106" height="14" fill="#3FA878" fill-opacity="0.25"/> <!-- 10-30% range -->
          <rect width="380" height="14" rx="3" fill="#3FA878"/>
          <line x1="430" y1="-2" x2="430" y2="16" stroke="#f87171" stroke-width="2"/> <!-- Cap Limit -->
        </g>

        <!-- Ruler 2: Power Budget -->
        <text class="mono" x="0" y="56" font-size="11" fill="#EDE7D8">2. ELECTRICAL POWER [SCIENCE MODE AT 1.52 AU]</text>
        <text class="mono" x="532" y="56" font-size="11" fill="#3FA878" font-weight="700" text-anchor="end">+14.6% [420W / 365W]</text>
        <g transform="translate(0, 62)">
          <rect width="532" height="14" rx="3" fill="#060d24" stroke="#1A3A85"/>
          <rect x="53" width="106" height="14" fill="#3FA878" fill-opacity="0.25"/>
          <rect width="330" height="14" rx="3" fill="#3FA878"/>
          <line x1="400" y1="-2" x2="400" y2="16" stroke="#f87171" stroke-width="2"/>
        </g>

        <!-- Ruler 3: Delta-V Budget -->
        <text class="mono" x="0" y="102" font-size="11" fill="#EDE7D8">3. PROPULSION DELTA-V [CLOSED TANK FORMULA]</text>
        <text class="mono" x="532" y="102" font-size="11" fill="#E3A92F" font-weight="700" text-anchor="end">+12.6% [3,850 m/s]</text>
        <g transform="translate(0, 108)">
          <rect width="532" height="14" rx="3" fill="#060d24" stroke="#1A3A85"/>
          <rect x="53" width="106" height="14" fill="#3FA878" fill-opacity="0.25"/>
          <rect width="310" height="14" rx="3" fill="#E3A92F"/>
          <line x1="390" y1="-2" x2="390" y2="16" stroke="#f87171" stroke-width="2"/>
        </g>

        <!-- Ruler 4: Financial Budget -->
        <text class="mono" x="0" y="148" font-size="11" fill="#EDE7D8">4. TOTAL MISSION EXPENDITURE [WITH 15% RESERVE]</text>
        <text class="mono" x="532" y="148" font-size="11" fill="#3FA878" font-weight="700" text-anchor="end">$482M / $600M</text>
        <g transform="translate(0, 154)">
          <rect width="532" height="14" rx="3" fill="#060d24" stroke="#1A3A85"/>
          <rect x="53" width="106" height="14" fill="#3FA878" fill-opacity="0.25"/>
          <rect width="425" height="14" rx="3" fill="#3FA878"/>
          <line x1="530" y1="-2" x2="530" y2="16" stroke="#f87171" stroke-width="2"/>
        </g>

        <!-- Active Math Formula Footnote -->
        <g transform="translate(0, 184)">
          <rect width="532" height="24" rx="4" fill="#060c24" stroke="#1A3A85" stroke-width="1"/>
          <text class="mono" x="266" y="16" font-size="10" fill="#E3A92F" text-anchor="middle">
            Δv = Isp · g₀ · ln(m_wet / m_dry)  ◆  m_prop = m_other · (e^x - 1) / (1 - k · (e^x - 1))
          </text>
        </g>
      </g>
    </g>

    <!-- Outer Structural Border -->
    <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#1A3A85" stroke-width="1.5"/>
  </g>
</svg>
