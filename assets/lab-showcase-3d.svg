<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Enter the AMUN Live Mission Simulation Lab">
  <defs>
    <filter id="lGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="lBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0d1f4c"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="lBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E3A92F"/>
      <stop offset="100%" stop-color="#3FA878"/>
    </linearGradient>
    <clipPath id="lClip"><rect width="1200" height="240" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, system-ui, sans-serif; }
    .mono { font-family: 'SF Mono', Consolas, 'Fira Code', monospace; }
    @keyframes portalGlow { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.08); } }
    .portal { transform-origin: 1060px 120px; animation: portalGlow 4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#lClip)">
    <rect width="1200" height="240" fill="url(#lBg)"/>

    <!-- Technical Grid -->
    <g opacity="0.1" stroke="#EDE7D8" stroke-width="0.75">
      <line x1="0" y1="60" x2="1200" y2="60"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="240" y1="0" x2="240" y2="240"/>
      <line x1="480" y1="0" x2="480" y2="240"/>
      <line x1="720" y1="0" x2="720" y2="240"/>
      <line x1="960" y1="0" x2="960" y2="240"/>
    </g>

    <!-- Left Hologram Portal Icon -->
    <circle cx="80" cy="120" r="45" fill="#E3A92F" opacity="0.12" filter="url(#lGlow)"/>
    <circle cx="80" cy="120" r="32" fill="none" stroke="#E3A92F" stroke-width="2"/>
    <circle cx="80" cy="120" r="22" fill="none" stroke="#3FA878" stroke-width="1.8" stroke-dasharray="4 4"/>
    <circle cx="80" cy="120" r="8" fill="#FFF"/>

    <!-- Text Information -->
    <text class="mono" x="145" y="68" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3FA878">LIVE INTERACTIVE SHOWCASE • OMAR METMAN LAB</text>
    <text x="145" y="105" font-size="28" font-weight="900" fill="#EDE7D8" letter-spacing="1">PROJECT AMUN — MISSION SIMULATOR</text>
    <text x="145" y="140" font-size="15" fill="#9db1db">Direct browser deployment with zero installation, offline-ready architecture, and real JPL datasets.</text>
    
    <!-- URL Monospace Badge -->
    <rect x="145" y="165" width="370" height="34" rx="6" fill="#060c1d" stroke="#1A3A85" stroke-width="1"/>
    <circle cx="165" cy="182" r="4" fill="#3FA878"/>
    <text class="mono" x="180" y="187" font-size="13" font-weight="600" fill="#E3A92F">omarmetman.vercel.app/projects/amun</text>

    <!-- Right Side 3D Interactive Launch Button -->
    <g class="portal">
      <circle cx="1060" cy="120" r="60" fill="#3FA878" opacity="0.2" filter="url(#lGlow)"/>
    </g>
    <rect x="910" y="90" width="230" height="60" rx="12" fill="url(#lBtn)" stroke="#FFF" stroke-width="2" filter="url(#lGlow)"/>
    <text x="1025" y="126" font-size="17" font-weight="900" text-anchor="middle" fill="#0D1F4C" letter-spacing="1">LAUNCH LAB 🚀</text>
  </g>

  <!-- Outer Border -->
  <rect x="1.5" y="1.5" width="1197" height="237" rx="19" fill="none" stroke="#E3A92F" stroke-width="2"/>
</svg>